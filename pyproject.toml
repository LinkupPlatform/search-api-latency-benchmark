[project]
name = "search-api-latency-benchmark"
version = "0.1.0"
description = "Regional latency and SimpleQA Verified quality benchmarks for web search APIs"
requires-python = ">=3.13"
dependencies = [
    "openai>=3.11.0",
    "python-dotenv>=1.2.3",
    "tqdm>=4.67.1",
]

[project.scripts]
region-scout = "search_benchmark.cli.region_scout:main"
simpleqa-generate-queries = "search_benchmark.cli.generate_queries:main"
simpleqa-quality = "search_benchmark.cli.quality:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/search_benchmark"]

[tool.uv]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.16.6",
]
